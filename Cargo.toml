[package]
name = "electronic-nose"
version = "0.1.0"
edition = "2021"
authors = ["Your Name <your.email@example.com>"]
description = "Electronic Nose with Deep Learning using Rust"
license = "MIT"
repository = "https://github.com/yourusername/electronic-nose-rust"

[dependencies]
# Hardware & GPIO
rppal = "0.14"
ads1x1x = "0.2"
linux-embedded-hal = "0.4"

# Machine Learning
candle-core = "0.4"
candle-nn = "0.4"
candle-transformers = "0.4"
ndarray = "0.15"
linfa = "0.7"
smartcore = "0.3"

# Database
rusqlite = { version = "0.30", features = ["bundled"] }
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "sqlite"] }

# Async Runtime
tokio = { version = "1.0", features = ["full"] }
futures = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
csv = "1.3"

# GUI Framework
eframe = "0.25"
egui = "0.25"
egui_plot = "0.25"
rfd = "0.13"

# Web Framework (for API)
axum = "0.7"
tower = "0.4"
tower-http = { version = "0.5", features = ["cors"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
anyhow = "1.0"
thiserror = "1.0"
log = "0.4"
env_logger = "0.10"
clap = { version = "4.0", features = ["derive"] }

# Math & Statistics
nalgebra = "0.32"
statrs = "0.16"
rand = "0.8"

[dev-dependencies]
criterion = "0.5"
proptest = "1.0"
tempfile = "3.0"

[[bin]]
name = "electronic-nose"
path = "src/main.rs"

[profile.release]
lto = true
codegen-units = 1
panic = "abort"
strip = true